<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Speed Controller</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #6366f1;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
      transition: transform 0.15s ease;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .vinyl-spinning {
      animation: spin-slow 10s linear infinite;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-indigo-500 selection:text-white">

  <!-- Main Mobile App Shell -->
  <main class="w-full max-w-md bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-3xl p-6 shadow-2xl relative overflow-hidden">
    
    <!-- Toast Notification for Restore -->
    <div id="toast" class="absolute top-4 left-1/2 -translate-x-1/2 z-30 bg-emerald-600 text-white text-xs font-semibold px-4 py-1.5 rounded-full shadow-lg transition-all duration-300 opacity-0 pointer-events-none -translate-y-3 flex items-center gap-1.5">
      <span>💾</span> <span id="toastText">Đã khôi phục phiên nghe trước!</span>
    </div>

    <!-- Ambient Background Glow -->
    <div class="absolute -top-24 -left-24 w-48 h-48 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-violet-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Header -->
    <header class="flex items-center justify-between pb-5 border-b border-slate-800/80">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-500 to-violet-500 flex items-center justify-center text-sm shadow-md shadow-indigo-500/20">
          ⚡
        </div>
        <div>
          <h1 class="text-sm font-bold tracking-tight">Audio Speed App</h1>
          <p class="text-[11px] text-slate-400">Trình phát & đổi tốc độ nhạc</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="clearBtn" class="text-xs px-2.5 py-1 rounded-full text-rose-400 hover:bg-rose-500/10 transition border border-rose-500/20 hidden">
          Xóa
        </button>
        <button id="demoBtn" class="text-xs px-3 py-1.5 rounded-full bg-slate-800 hover:bg-slate-700 text-indigo-400 font-medium transition flex items-center gap-1.5 border border-slate-700">
          <span>✨</span> Demo
        </button>
      </div>
    </header>

    <!-- Upload Dropzone -->
    <div id="dropZone" class="mt-5 border-2 border-dashed border-slate-700 hover:border-indigo-500 rounded-2xl p-5 text-center cursor-pointer transition-all bg-slate-800/30 hover:bg-indigo-950/20 group">
      <input type="file" id="fileInput" accept="audio/*" class="hidden">
      <div class="flex flex-col items-center gap-2">
        <div class="w-12 h-12 rounded-2xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center text-xl group-hover:scale-110 transition-transform">
          🎵
        </div>
        <div>
          <p class="text-xs font-semibold text-slate-200">Tải lên file âm thanh</p>
          <p class="text-[11px] text-slate-400 mt-0.5">Tự động lưu lại, reload trang không mất</p>
        </div>
      </div>
    </div>

    <!-- Track Display -->
    <div class="mt-6 flex flex-col items-center">
      <!-- Vinyl / Artwork -->
      <div class="relative flex items-center justify-center mb-4">
        <div id="vinylDisc" class="w-28 h-28 rounded-full border-4 border-slate-800 bg-gradient-to-tr from-slate-950 via-slate-800 to-slate-900 shadow-xl flex items-center justify-center relative">
          <div class="w-20 h-20 rounded-full border border-slate-700/50 flex items-center justify-center">
            <div class="w-14 h-14 rounded-full border border-slate-700/40 flex items-center justify-center">
              <span class="text-2xl">🎧</span>
            </div>
          </div>
          <div class="w-8 h-8 rounded-full bg-slate-900 border-2 border-indigo-500 absolute flex items-center justify-center">
            <div class="w-2.5 h-2.5 rounded-full bg-indigo-400"></div>
          </div>
        </div>
      </div>

      <h2 id="trackTitle" class="text-sm font-bold text-center px-4 truncate max-w-full text-slate-100">Chưa có bài hát</h2>
      <p id="trackMeta" class="text-xs text-slate-400 mt-0.5">Sẵn sàng phát nhạc</p>

      <!-- Waveform Canvas -->
      <div class="w-full bg-slate-950/60 rounded-xl p-2.5 mt-4 border border-slate-800">
        <canvas id="visualizer" width="340" height="32" class="w-full h-8"></canvas>
      </div>

      <!-- Scrubber Timeline -->
      <div class="w-full mt-4 flex flex-col gap-1.5">
        <input type="range" id="progressBar" min="0" max="100" value="0" step="0.1" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer">
        <div class="flex justify-between text-xs font-mono text-slate-400">
          <span id="currentTime">00:00</span>
          <span id="totalDuration">00:00</span>
        </div>
      </div>

      <!-- Transport Controls -->
      <div class="flex items-center justify-center gap-6 mt-3">
        <button id="rewindBtn" class="w-10 h-10 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold transition flex items-center justify-center shadow" title="-5 giây">
          -5s
        </button>
        <button id="playBtn" class="w-14 h-14 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white text-2xl font-bold transition flex items-center justify-center shadow-lg shadow-indigo-600/30 active:scale-95" title="Phát">
          ▶
        </button>
        <button id="forwardBtn" class="w-10 h-10 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold transition flex items-center justify-center shadow" title="+5 giây">
          +5s
        </button>
      </div>

      <!-- Speed Control Section -->
      <div class="w-full bg-slate-800/50 border border-slate-800 rounded-2xl p-3.5 mt-5">
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-1.5">
            <span class="text-xs font-semibold text-slate-300">Tốc độ phát (Speed):</span>
          </div>
          <span id="speedDisplay" class="text-xs font-mono font-bold text-indigo-400 bg-indigo-950/60 px-2 py-0.5 rounded-full border border-indigo-800/50">1.0x</span>
        </div>
        <div class="grid grid-cols-5 gap-1.5">
          <button data-speed="0.5" class="speed-pill py-1.5 text-xs font-medium rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition">0.5x</button>
          <button data-speed="0.75" class="speed-pill py-1.5 text-xs font-medium rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition">0.75x</button>
          <button data-speed="1.0" class="speed-pill active py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition">1.0x</button>
          <button data-speed="1.5" class="speed-pill py-1.5 text-xs font-medium rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition">1.5x</button>
          <button data-speed="2.0" class="speed-pill py-1.5 text-xs font-medium rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition">2.0x</button>
        </div>
      </div>

      <!-- Volume Bar -->
      <div class="w-full flex items-center gap-3 mt-4 px-1">
        <button id="volumeIcon" class="text-slate-400 hover:text-slate-200 text-sm">🔊</button>
        <input type="range" id="volumeBar" min="0" max="1" step="0.05" value="0.85" class="w-full h-1 bg-slate-800 rounded appearance-none cursor-pointer">
      </div>

    </div>

  </main>

  <audio id="audioElement" preload="metadata"></audio>

  <script>
    // --- IndexedDB & LocalStorage Keys ---
    const DB_NAME = 'AudioSpeedAppDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'audioStore';

    const STORAGE_KEYS = {
      SPEED: 'audio_speed',
      VOLUME: 'audio_volume',
      PROGRESS: 'audio_progress',
      FILE_NAME: 'audio_file_name',
      FILE_SIZE: 'audio_file_size',
      FILE_TYPE: 'audio_file_type'
    };

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveAudioBlob(blob) {
      try {
        const db = await openDB();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(blob, 'lastTrack');
      } catch (err) {
        console.error('Lỗi lưu IndexedDB:', err);
      }
    }

    async function getSavedAudioBlob() {
      try {
        const db = await openDB();
        return new Promise((resolve) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const req = tx.objectStore(STORE_NAME).get('lastTrack');
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        });
      } catch (err) {
        return null;
      }
    }

    async function clearSavedData() {
      try {
        const db = await openDB();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).delete('lastTrack');
      } catch (err) {}
      Object.values(STORAGE_KEYS).forEach(k => localStorage.removeItem(k));
    }

    // --- DOM Elements ---
    const audio = document.getElementById('audioElement');
    const playBtn = document.getElementById('playBtn');
    const rewindBtn = document.getElementById('rewindBtn');
    const forwardBtn = document.getElementById('forwardBtn');
    const progressBar = document.getElementById('progressBar');
    const currentTimeEl = document.getElementById('currentTime');
    const totalDurationEl = document.getElementById('totalDuration');
    const volumeBar = document.getElementById('volumeBar');
    const volumeIcon = document.getElementById('volumeIcon');
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const trackTitle = document.getElementById('trackTitle');
    const trackMeta = document.getElementById('trackMeta');
    const vinylDisc = document.getElementById('vinylDisc');
    const speedDisplay = document.getElementById('speedDisplay');
    const speedButtons = document.querySelectorAll('.speed-pill');
    const demoBtn = document.getElementById('demoBtn');
    const clearBtn = document.getElementById('clearBtn');
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toastText');
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');

    let currentSpeed = 1.0;
    let animId = null;
    let lastSavedProgressTime = 0;
    let pendingResumeTime = null;

    function formatTime(sec) {
      if (isNaN(sec) || sec < 0) return '00:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
    }

    function showToast(msg) {
      toastText.textContent = msg;
      toast.classList.remove('opacity-0', '-translate-y-3');
      toast.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-3');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2500);
    }

    function setSpeed(speed, shouldSave = true) {
      currentSpeed = speed;
      audio.playbackRate = currentSpeed;
      audio.preservesPitch = true;
      speedDisplay.textContent = currentSpeed.toFixed(1) + 'x';

      speedButtons.forEach(btn => {
        if (parseFloat(btn.dataset.speed) === currentSpeed) {
          btn.classList.add('active', 'bg-indigo-600', 'text-white', 'font-semibold');
          btn.classList.remove('bg-slate-800', 'text-slate-300', 'font-medium');
        } else {
          btn.classList.remove('active', 'bg-indigo-600', 'text-white', 'font-semibold');
          btn.classList.add('bg-slate-800', 'text-slate-300', 'font-medium');
        }
      });

      if (shouldSave) {
        localStorage.setItem(STORAGE_KEYS.SPEED, currentSpeed);
      }
    }

    function loadAudioBlob(blob, name, size, type, resumeProgress = 0, autoPlay = false) {
      if (audio.src) URL.revokeObjectURL(audio.src);
      const fileUrl = URL.createObjectURL(blob);
      audio.src = fileUrl;
      audio.playbackRate = currentSpeed;
      audio.preservesPitch = true;

      trackTitle.textContent = name;
      const sizeMB = size ? (size / (1024 * 1024)).toFixed(2) : '0';
      const ext = (type && type.includes('/')) ? type.split('/')[1].toUpperCase() : 'AUDIO';
      trackMeta.textContent = ext + ' • ' + sizeMB + ' MB';
      clearBtn.classList.remove('hidden');

      if (resumeProgress > 0) {
        pendingResumeTime = resumeProgress;
      }

      if (autoPlay) {
        audio.play().then(() => updatePlayState(true)).catch(() => updatePlayState(false));
      }
    }

    async function handleFile(file) {
      if (!file || !file.type.startsWith('audio/')) {
        alert('Vui lòng chọn file âm thanh hợp lệ.');
        return;
      }
      await saveAudioBlob(file);
      localStorage.setItem(STORAGE_KEYS.FILE_NAME, file.name);
      localStorage.setItem(STORAGE_KEYS.FILE_SIZE, file.size);
      localStorage.setItem(STORAGE_KEYS.FILE_TYPE, file.type);
      localStorage.setItem(STORAGE_KEYS.PROGRESS, 0);

      loadAudioBlob(file, file.name, file.size, file.type, 0, true);
    }

    // Audio Demo Synth
    async function createDemoAudio() {
      const sampleRate = 22050;
      const duration = 8.0;
      const totalSamples = sampleRate * duration;
      const buffer = new Float32Array(totalSamples);
      const notes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
      for (let i = 0; i < totalSamples; i++) {
        const t = i / sampleRate;
        const noteIdx = Math.floor(t * 3) % notes.length;
        const freq = notes[noteIdx];
        const env = Math.exp(-3 * ((t * 3) % 1));
        buffer[i] = Math.sin(2 * Math.PI * freq * t) * env * 0.4;
      }
      const wavBytes = encodeWav(buffer, sampleRate);
      const blob = new Blob([wavBytes], { type: 'audio/wav' });
      const demoFile = new File([blob], 'demo-ambient.wav', { type: 'audio/wav' });
      await handleFile(demoFile);
    }

    function encodeWav(samples, sampleRate) {
      const buffer = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(buffer);
      function writeString(view, offset, string) {
        for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
      }
      writeString(view, 0, 'RIFF');
      view.setUint32(4, 36 + samples.length * 2, true);
      writeString(view, 8, 'WAVE');
      writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeString(view, 36, 'data');
      view.setUint32(40, samples.length * 2, true);
      let offset = 44;
      for (let i = 0; i < samples.length; i++, offset += 2) {
        const s = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      }
      return buffer;
    }

    demoBtn.addEventListener('click', () => createDemoAudio());

    clearBtn.addEventListener('click', async () => {
      audio.pause();
      audio.src = '';
      updatePlayState(false);
      await clearSavedData();
      trackTitle.textContent = 'Chưa có bài hát';
      trackMeta.textContent = 'Sẵn sàng phát';
      progressBar.value = 0;
      currentTimeEl.textContent = '00:00';
      totalDurationEl.textContent = '00:00';
      clearBtn.classList.add('hidden');
      showToast('Đã xóa dữ liệu lưu!');
    });

    function updatePlayState(isPlaying) {
      if (isPlaying) {
        playBtn.innerHTML = '⏸';
        vinylDisc.classList.add('vinyl-spinning');
        startVisualizer();
      } else {
        playBtn.innerHTML = '▶';
        vinylDisc.classList.remove('vinyl-spinning');
        stopVisualizer();
      }
    }

    playBtn.addEventListener('click', () => {
      if (!audio.src) {
        createDemoAudio();
        return;
      }
      if (audio.paused) {
        audio.play();
        updatePlayState(true);
      } else {
        audio.pause();
        updatePlayState(false);
      }
    });

    rewindBtn.addEventListener('click', () => {
      if (audio.currentTime) {
        audio.currentTime = Math.max(0, audio.currentTime - 5);
        localStorage.setItem(STORAGE_KEYS.PROGRESS, audio.currentTime);
      }
    });
    forwardBtn.addEventListener('click', () => {
      if (audio.duration) {
        audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
        localStorage.setItem(STORAGE_KEYS.PROGRESS, audio.currentTime);
      }
    });

    audio.addEventListener('timeupdate', () => {
      if (!isNaN(audio.duration) && audio.duration > 0) {
        progressBar.value = (audio.currentTime / audio.duration) * 100;
        currentTimeEl.textContent = formatTime(audio.currentTime);

        // Lưu tiến trình định kỳ mỗi giây
        if (Math.abs(audio.currentTime - lastSavedProgressTime) >= 1) {
          lastSavedProgressTime = audio.currentTime;
          localStorage.setItem(STORAGE_KEYS.PROGRESS, audio.currentTime);
        }
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      totalDurationEl.textContent = formatTime(audio.duration);
      if (pendingResumeTime !== null && pendingResumeTime > 0 && pendingResumeTime < audio.duration) {
        audio.currentTime = pendingResumeTime;
        currentTimeEl.textContent = formatTime(pendingResumeTime);
        progressBar.value = (pendingResumeTime / audio.duration) * 100;
        showToast('Đã khôi phục tại ' + formatTime(pendingResumeTime));
        pendingResumeTime = null;
      } else {
        currentTimeEl.textContent = formatTime(0);
        progressBar.value = 0;
      }
    });

    audio.addEventListener('ended', () => {
      updatePlayState(false);
      progressBar.value = 0;
      currentTimeEl.textContent = '00:00';
      localStorage.setItem(STORAGE_KEYS.PROGRESS, 0);
    });

    progressBar.addEventListener('input', () => {
      if (audio.duration) {
        audio.currentTime = (progressBar.value / 100) * audio.duration;
        localStorage.setItem(STORAGE_KEYS.PROGRESS, audio.currentTime);
      }
    });

    // Volume
    volumeBar.addEventListener('input', (e) => {
      audio.volume = e.target.value;
      localStorage.setItem(STORAGE_KEYS.VOLUME, audio.volume);
      volumeIcon.textContent = audio.volume == 0 ? '🔇' : (audio.volume < 0.5 ? '🔉' : '🔊');
    });

    volumeIcon.addEventListener('click', () => {
      if (audio.volume > 0) {
        audio.dataset.prevVol = audio.volume;
        audio.volume = 0;
        volumeBar.value = 0;
        volumeIcon.textContent = '🔇';
      } else {
        const restore = audio.dataset.prevVol || 0.8;
        audio.volume = restore;
        volumeBar.value = restore;
        volumeIcon.textContent = '🔊';
      }
      localStorage.setItem(STORAGE_KEYS.VOLUME, audio.volume);
    });

    speedButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        setSpeed(parseFloat(btn.dataset.speed), true);
      });
    });

    // Drag & Drop
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) handleFile(e.target.files[0]);
    });

    ['dragenter', 'dragover'].forEach(name => {
      dropZone.addEventListener(name, (e) => {
        e.preventDefault();
        dropZone.classList.add('border-indigo-500', 'bg-indigo-950/40');
      });
    });

    ['dragleave', 'drop'].forEach(name => {
      dropZone.addEventListener(name, (e) => {
        e.preventDefault();
        dropZone.classList.remove('border-indigo-500', 'bg-indigo-950/40');
      });
    });

    dropZone.addEventListener('drop', (e) => {
      if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
    });

    function drawIdleVisualizer() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const bars = 42;
      const barWidth = canvas.width / bars - 2;
      for (let i = 0; i < bars; i++) {
        const height = 4;
        ctx.fillStyle = '#475569';
        ctx.fillRect(i * (barWidth + 2), (canvas.height - height) / 2, barWidth, height);
      }
    }
    drawIdleVisualizer();

    function startVisualizer() {
      if (animId) cancelAnimationFrame(animId);
      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const bars = 42;
        const barWidth = canvas.width / bars - 2;
        const time = Date.now() / 150;
        for (let i = 0; i < bars; i++) {
          const wave = Math.sin(time + i * 0.35) * 0.5 + 0.5;
          const height = Math.max(4, wave * (canvas.height - 4));
          ctx.fillStyle = '#6366f1';
          ctx.fillRect(i * (barWidth + 2), (canvas.height - height) / 2, barWidth, height);
        }
        animId = requestAnimationFrame(render);
      }
      render();
    }

    function stopVisualizer() {
      if (animId) cancelAnimationFrame(animId);
      drawIdleVisualizer();
    }

    // --- Khôi phục cấu hình & tiến trình khi khởi chạy ---
    async function restoreSession() {
      // 1. Phục hồi Volume
      const savedVol = localStorage.getItem(STORAGE_KEYS.VOLUME);
      if (savedVol !== null) {
        audio.volume = parseFloat(savedVol);
        volumeBar.value = savedVol;
        volumeIcon.textContent = audio.volume == 0 ? '🔇' : (audio.volume < 0.5 ? '🔉' : '🔊');
      } else {
        audio.volume = 0.85;
      }

      // 2. Phục hồi Speed
      const savedSpeed = localStorage.getItem(STORAGE_KEYS.SPEED);
      if (savedSpeed !== null) {
        setSpeed(parseFloat(savedSpeed), false);
      }

      // 3. Phục hồi File âm thanh từ IndexedDB & tiến trình nghe
      const savedBlob = await getSavedAudioBlob();
      const savedName = localStorage.getItem(STORAGE_KEYS.FILE_NAME);
      const savedSize = localStorage.getItem(STORAGE_KEYS.FILE_SIZE);
      const savedType = localStorage.getItem(STORAGE_KEYS.FILE_TYPE);
      const savedProgress = parseFloat(localStorage.getItem(STORAGE_KEYS.PROGRESS) || '0');

      if (savedBlob && savedName) {
        loadAudioBlob(savedBlob, savedName, savedSize, savedType, savedProgress, false);
      }
    }

    window.addEventListener('DOMContentLoaded', restoreSession);
  </script>
</body>
</html>
